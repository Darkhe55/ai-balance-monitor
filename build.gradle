plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.aibalance'
version = '0.1.1'
description = 'AI 余额监控 - 实时查看主流 AI 服务的 API 余额与用量配额'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    modularity.inferModulePath = false
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.aibalance.ui.AppLauncher'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    implementation 'org.conscrypt:conscrypt-openjdk-uber:2.5.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.aliyun:aliyun-java-sdk-core:4.6.3'
    implementation 'com.aliyun:aliyun-java-sdk-bssopenapi:1.8.13'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
    maxHeapSize = '1g'
}

def distDir = layout.buildDirectory.dir('dist/ai-balance-monitor')
def jlinkExe = javaToolchains.launcherFor(java.toolchain)
        .map { it.metadata.installationPath.file('bin/jlink.exe') }
        .get()

tasks.register('buildDist') {
    dependsOn 'build'
    doLast {
        def out = distDir.get().asFile
        def mpathDir = new File(buildDir, 'javafx-modpath')
        if (mpathDir.exists()) {
            delete mpathDir
        }
        mpathDir.mkdirs()
        copy {
            from configurations.runtimeClasspath
            into mpathDir
            include 'javafx-*.jar'
        }
        def runtimeDir = new File(out, 'runtime')
        if (runtimeDir.exists()) {
            delete runtimeDir
        }
        exec {
            executable jlinkExe
            args '--module-path', mpathDir.absolutePath,
                    '--add-modules',
                    'java.base,java.desktop,java.logging,java.naming,java.xml,java.sql,jdk.crypto.ec,jdk.unsupported,jdk.localedata,javafx.controls',
                    '--output', runtimeDir.absolutePath,
                    '--strip-debug', '--compress=2', '--no-header-files', '--no-man-pages'
        }
        def appDir = new File(out, 'app')
        if (appDir.exists()) {
            delete appDir
        }
        appDir.mkdirs()
        copy {
            from configurations.runtimeClasspath
            into appDir
        }
        copy {
            from tasks.named('jar').get().archiveFile
            into appDir
            rename { 'ai-balance-monitor.jar' }
        }
        def bat = new File(out, 'ai-balance-monitor.bat')
        bat.text = '''
@echo off
setlocal
set "DIR=%~dp0"
start "" "%DIR%runtime\\bin\\javaw.exe" -Djava.net.preferIPv4Stack=true --add-modules javafx.controls -cp "%DIR%app\\*" com.aibalance.ui.AppLauncher %*
endlocal
'''.stripIndent().trim()
    }
}

def jpackageExe = javaToolchains.launcherFor(java.toolchain)
        .map { it.metadata.installationPath.file('bin/jpackage.exe') }
        .get()
def jpackageOut = layout.buildDirectory.dir('dist-exe')
def appIconFile = rootProject.file('docs/icons/app.ico')

tasks.register('jpackageImage') {
    dependsOn 'buildDist'
    doLast {
        def outDir = jpackageOut.get().asFile
        if (outDir.exists()) {
            delete outDir
        }
        outDir.mkdirs()
        def runtimeDir = new File(distDir.get().asFile, 'runtime')
        def appDir = new File(distDir.get().asFile, 'app')
        def jargs = [
                '--type', 'app-image',
                '--app-version', project.version,
                '--name', 'AI余额监控',
                '--input', appDir.absolutePath,
                '--main-jar', 'ai-balance-monitor.jar',
                '--main-class', 'com.aibalance.ui.AppLauncher',
                '--runtime-image', runtimeDir.absolutePath,
                '--java-options', '-Djava.net.preferIPv4Stack=true',
                '--java-options', '--add-modules=javafx.controls',
                '--dest', outDir.absolutePath
        ]
        if (appIconFile.exists()) {
            jargs += ['--icon', appIconFile.absolutePath]
            println("[jpackageImage] 使用自定义图标: ${appIconFile.name}")
        } else {
            println("[jpackageImage] 未找到 docs/icons/app.ico，使用 jpackage 默认图标")
        }
        exec {
            executable jpackageExe
            args jargs
        }
    }
}
