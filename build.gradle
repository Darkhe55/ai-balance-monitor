plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.aibalance'
version = '0.1.0'
description = 'AI 套餐余额监控 - 实时查看主流 AI 服务的 API 余额与用量配额'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // 应用以 classpath 方式运行：Conscrypt/OkHttp 在模块化（jlink mergedModule）
    // 打包下会出现 "Unknown authType: GENERIC" 握手失败，classpath 方式经实测正常
    modularity.inferModulePath = false
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.aibalance.ui.AppLauncher'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    // Conscrypt（BoringSSL 移植）：ClientHello 指纹接近浏览器，用于绕开按 TLS 指纹拦截的网络设备
    implementation 'org.conscrypt:conscrypt-openjdk-uber:2.5.2'
    // OkHttp：HTTP 客户端（与 Conscrypt SSLSocketFactory 组合，避免 JDK HttpClient 的 authType 兼容问题）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 阿里云官方 SDK：BssOpenApi 的 endpoint 解析（按 Service + Region）与 RPC 签名统一由官方 SDK 处理，
    // 应用侧仅实现 IHttpClient 桥接到本工具统一的 HTTP 通道（Conscrypt TLS + 系统代理/直连开关）。
    implementation 'com.aliyun:aliyun-java-sdk-core:4.6.3'
    implementation 'com.aliyun:aliyun-java-sdk-bssopenapi:1.8.13'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
    maxHeapSize = '1g'
}

// 自包含发行版：jlink 生成精简 JRE（系统模块 + JavaFX），应用与第三方依赖
// 以 classpath 启动（避免模块化合并导致的 Conscrypt TLS 兼容问题）。
def distDir = layout.buildDirectory.dir('dist/ai-balance-monitor')
def jlinkExe = javaToolchains.launcherFor(java.toolchain)
        .map { it.metadata.installationPath.file('bin/jlink.exe') }
        .get()

tasks.register('buildDist') {
    dependsOn 'build'
    doLast {
        def out = distDir.get().asFile
        // 0) JavaFX 模块 jar（javafx 插件放在 classpath，jlink 需要以模块路径提供）
        def mpathDir = new File(buildDir, 'javafx-modpath')
        if (mpathDir.exists()) {
            delete mpathDir
        }
        mpathDir.mkdirs()
        copy {
            from configurations.runtimeClasspath
            into mpathDir
            include 'javafx-*.jar'
        }
        // 1) 精简 JRE
        def runtimeDir = new File(out, 'runtime')
        if (runtimeDir.exists()) {
            delete runtimeDir
        }
        // java.naming / java.xml / java.sql: required by the Aliyun SDK (ApacheHttpClient SSL
        // factory + JAXB response parsing). A jlink runtime without java.naming makes the
        // SDK throw NoClassDefFoundError: javax/naming/NamingException (silent failure in exe).
        exec {
            executable jlinkExe
            args '--module-path', mpathDir.absolutePath,
                    '--add-modules',
                    'java.base,java.desktop,java.logging,java.naming,java.xml,java.sql,jdk.crypto.ec,jdk.unsupported,jdk.localedata,javafx.controls',
                    '--output', runtimeDir.absolutePath,
                    '--strip-debug', '--compress=2', '--no-header-files', '--no-man-pages'
        }
        // 2) 应用与依赖 jar（平铺到 app/）
        def appDir = new File(out, 'app')
        if (appDir.exists()) {
            delete appDir
        }
        appDir.mkdirs()
        copy {
            from configurations.runtimeClasspath
            into appDir
        }
        copy {
            from tasks.named('jar').get().archiveFile
            into appDir
            rename { 'ai-balance-monitor.jar' }
        }
        // 3) Windows 启动脚本（javaw：无控制台窗口，纯 GUI 常驻）
        def bat = new File(out, 'ai-balance-monitor.bat')
        bat.text = '''
@echo off
setlocal
set "DIR=%~dp0"
start "" "%DIR%runtime\\bin\\javaw.exe" -Djava.net.preferIPv4Stack=true --add-modules javafx.controls -cp "%DIR%app\\*" com.aibalance.ui.AppLauncher %*
endlocal
'''.stripIndent().trim()
    }
}
